<header class="fixed top-0 z-50 w-full border-b border-white/10 bg-[#050c1f]/80 backdrop-blur-md">
  <div class="mx-auto max-w-7xl px-4">
    <p-menubar [model]="items" styleClass="border-none bg-transparent py-2">
      <ng-template pTemplate="start">
        <a routerLink="/" class="mr-8 flex items-center gap-3 no-underline">
          <img *ngIf="settings.logoUrl" [src]="settings.logoUrl" alt="logo" class="h-9 w-9 rounded-full object-cover shadow-lg shadow-cyan-500/20" />
          <span class="bg-gradient-to-r from-cyan-400 to-fuchsia-500 bg-clip-text text-xl font-bold tracking-tight text-transparent">
            {{ settings.brandName || 'TRINAY AI' }}
          </span>
        </a>
      </ng-template>
      <ng-template pTemplate="item" let-item>
        <a [routerLink]="item.routerLink" class="p-menuitem-link flex items-center px-4 py-2 transition-all hover:bg-white/5">
          <span [class]="item.icon" class="mr-2"></span>
          <span class="text-sm font-medium uppercase tracking-wider text-slate-300 hover:text-white">{{ item.label }}</span>
        </a>
      </ng-template>
      <ng-template pTemplate="end">
        <button class="hidden items-center justify-center rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 px-6 py-2 text-xs font-bold uppercase tracking-widest text-white shadow-lg transition duration-300 hover:-translate-y-0.5 hover:shadow-cyan-500/30 md:flex">
          Get Started
        </button>
      </ng-template>
    </p-menubar>
  </div>
</header>

<main class="min-h-screen">
  <router-outlet></router-outlet>
</main>

<footer class="border-t border-white/5 bg-[#030816] py-12">
  <div class="mx-auto max-w-7xl px-6 text-center">
    <div class="mb-8 flex justify-center gap-6 text-slate-400">
      <a href="#" class="hover:text-white"><i class="pi pi-twitter"></i></a>
      <a href="#" class="hover:text-white"><i class="pi pi-linkedin"></i></a>
      <a href="#" class="hover:text-white"><i class="pi pi-github"></i></a>
    </div>
    <p class="text-sm tracking-wide text-slate-500">
      {{ settings.footerText }}
    </p>
    <div class="mt-4 flex justify-center gap-8 text-xs font-medium uppercase tracking-tighter text-slate-600">
      <a href="#" class="hover:text-slate-400">Privacy Policy</a>
      <a href="#" class="hover:text-slate-400">Terms of Service</a>
      <a href="#" class="hover:text-slate-400">Contact Us</a>
    </div>
  </div>
</footer>
