<nav class="fixed top-0 w-full z-50 border-b border-gray-800 bg-primary/80 px-6 py-4 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between">
    <a routerLink="/" class="flex items-center gap-3 text-2xl font-bold text-white">
      <img *ngIf="settings.logoUrl" [src]="settings.logoUrl" alt="logo" class="h-10 w-10 rounded-full object-cover" />
      <span class="bg-gradient-to-r from-futuristic-blue to-futuristic-purple bg-clip-text text-transparent">
        {{ settings.brandName || 'TRINAY AI' }}
      </span>
    </a>
    <div class="hidden gap-8 text-sm font-medium uppercase tracking-widest text-gray-400 md:flex">
      <a *ngFor="let item of settings.menuItems" [routerLink]="item.route" routerLinkActive="text-accent" class="transition-colors hover:text-white">
        {{ item.label }}
      </a>
    </div>
    <button class="text-white md:hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
      </svg>
    </button>
  </div>
</nav>

<main class="pt-20">
  <router-outlet></router-outlet>
</main>

<footer class="border-t border-gray-800 bg-primary p-8 text-center text-sm text-gray-500">
  <p>{{ settings.footerText }}</p>
</footer>
