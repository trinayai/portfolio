<header class="site-header fixed top-0 z-50 w-full border-b border-slate-200 bg-white" ngSkipHydration>
  <div class="mx-auto max-w-7xl px-4 h-20 flex items-center justify-between">
    <!-- Brand Identity -->
    <a routerLink="/" class="flex items-center no-underline group flex-shrink-0">
      <div class="logo-container">
        <img [src]="settings.logoUrl" alt="Trinay AI" class="h-10 w-auto object-contain transition-transform group-hover:scale-105" />
      </div>
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden lg:flex items-center gap-2">
      <ng-container *ngFor="let item of items">
        <a [routerLink]="item.routerLink"
           routerLinkActive="active-link"
           [routerLinkActiveOptions]="{exact: true}"
           class="px-4 py-2 text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-blue-600 transition-all rounded-lg hover:bg-slate-50 no-underline">
          {{ item.label }}
        </a>
      </ng-container>

      <div class="flex items-center gap-3 ml-6 pl-6 border-l border-slate-100">
        @if (!authUser) {
          <p-button label="Login" routerLink="/login" styleClass="p-button-text text-blue-600 font-bold uppercase text-[10px] tracking-widest"></p-button>
          <p-button label="Sign Up" routerLink="/register" styleClass="p-button-raised p-button-rounded"></p-button>
        } @else {
          <p-button label="My Account" icon="pi pi-user" routerLink="/profile" styleClass="p-button-raised p-button-rounded"></p-button>
          <p-button icon="pi pi-power-off" (onClick)="logout()" styleClass="p-button-text p-button-danger"></p-button>
        }
      </div>
    </div>

    <!-- Mobile Menu Button -->
    <button class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-xl transition-colors" (click)="sidebarVisible = true">
      <i class="pi pi-bars text-xl"></i>
    </button>
  </div>
</header>

<!-- Mobile Sidebar -->
<p-sidebar [(visible)]="sidebarVisible" position="right" styleClass="w-[70vw] sm:w-80 border-none bg-white">
  <ng-template pTemplate="header">
    <div class="flex items-center justify-between w-full pr-2">
      <div class="flex items-center gap-3">
        <img [src]="settings.logoUrl" alt="Logo" class="h-8 w-auto" />
        <span class="font-black text-slate-900 tracking-tighter">TRINAY AI</span>
      </div>
    </div>
  </ng-template>

  <div class="flex flex-col gap-2 mt-8">
    <ng-container *ngFor="let item of items">
      <a [routerLink]="item.routerLink"
         routerLinkActive="bg-blue-50 text-blue-600"
         [routerLinkActiveOptions]="{exact: true}"
         (click)="sidebarVisible = false"
         class="px-6 py-4 text-xs font-black uppercase tracking-widest text-slate-600 rounded-2xl no-underline hover:bg-slate-50 transition-colors">
        {{ item.label }}
      </a>
    </ng-container>

    <div class="mt-8 px-4 flex flex-col gap-3 pt-8 border-t border-slate-50">
      @if (!authUser) {
        <p-button label="Sign In" routerLink="/login" (onClick)="sidebarVisible = false"
                  styleClass="w-full p-button-outlined p-button-rounded py-4"></p-button>
        <p-button label="Get Started" routerLink="/register" (onClick)="sidebarVisible = false"
                  styleClass="w-full p-button-raised p-button-rounded py-4"></p-button>
      } @else {
        <p-button label="View Profile" icon="pi pi-user" routerLink="/profile" (onClick)="sidebarVisible = false"
                  styleClass="w-full p-button-raised p-button-rounded py-4"></p-button>
        <p-button label="Sign Out" icon="pi pi-power-off" (onClick)="logout()"
                  styleClass="w-full p-button-text p-button-danger py-4"></p-button>
      }
    </div>
  </div>
</p-sidebar>

<main class="min-h-screen pt-20 bg-white">
  <router-outlet></router-outlet>
</main>

<footer class="border-t border-slate-100 bg-white py-24">
  <div class="mx-auto max-w-7xl px-6 text-center">
    <div class="mb-12 flex justify-center gap-10 text-slate-400">
      <a href="https://www.linkedin.com/in/trinayai-technologies-aa5aa5434/" class="hover:text-blue-800 transition-colors"><i class="pi pi-linkedin text-2xl"></i></a>
      <a href="https://www.facebook.com/profile.php?id=61594227631346" class="hover:text-slate-900 transition-colors"><i class="pi pi-facebook text-2xl"></i></a>
      <a href="https://www.instagram.com/trinayai/" class="hover:text-slate-900 transition-colors"><i class="pi pi-instagram text-2xl"></i></a>
    </div>
    <p class="text-xs tracking-wide text-slate-500 max-w-2xl mx-auto leading-relaxed font-medium">
      {{ settings.footerText }}
    </p>
    <div class="mt-8 flex justify-center gap-10 text-[10px] font-black uppercase tracking-widest text-slate-400">
      <a routerLink="/privacy-policy" class="hover:text-slate-900 no-underline">Privacy Policy</a>
      <a routerLink="/terms-of-service" class="hover:text-slate-900 no-underline">Terms of Service</a>
      <a routerLink="/contact" class="hover:text-slate-900 no-underline">Contact Us</a>
    </div>
  </div>
</footer>
