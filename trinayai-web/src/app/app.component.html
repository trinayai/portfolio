<header class="fixed top-0 z-50 w-full border-b border-white/5 bg-slate-950/60 backdrop-blur-xl">
  <div class="mx-auto max-w-7xl px-4">
    <p-menubar [model]="items" styleClass="border-none bg-transparent py-4 custom-nav">
      <ng-template pTemplate="start">
        <a routerLink="/" class="flex items-center gap-3 no-underline group">
            <div class="relative">
            <div class="absolute inset-0 rounded-full bg-cyan-500 blur-md opacity-0 group-hover:opacity-40 transition-opacity"></div>
            <img *ngIf="settings.logoUrl" [src]="settings.logoUrl" alt="logo" class="relative h-10 w-10 rounded-full object-cover ring-1 ring-white/10" />
            <div *ngIf="!settings.logoUrl" class="relative h-10 w-10 rounded-full bg-gradient-to-tr from-cyan-500 to-fuchsia-600 flex items-center justify-center text-white font-bold">T</div>
          </div>
          <span class="bg-gradient-to-r from-cyan-400 via-blue-400 to-fuchsia-400 bg-clip-text text-2xl font-black tracking-tighter text-transparent">
            {{ settings.brandName || 'TRINAY AI' }}
          </span>
        </a>
      </ng-template>
      <ng-template pTemplate="item" let-item>
        <a [routerLink]="item.routerLink" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
           class="p-menuitem-link flex items-center px-5 py-2.5 transition-all rounded-xl hover:bg-white/5 mx-1 group">
          <span [class]="item.icon" class="mr-2 text-slate-400 group-hover:text-cyan-400"></span>
          <span class="text-sm font-bold uppercase tracking-widest text-slate-400 group-hover:text-white">{{ item.label }}</span>
        </a>
      </ng-template>
      <ng-template pTemplate="end">
        <div class="flex items-center gap-4 ml-4">
          <p-button label="Connect" icon="pi pi-bolt"
                    styleClass="p-button-raised p-button-rounded bg-gradient-to-r from-cyan-500 to-blue-600 border-none px-6 py-2.5 font-bold uppercase tracking-widest text-white hidden md:flex shadow-lg shadow-cyan-500/20"></p-button>
        </div>
      </ng-template>
    </p-menubar>
  </div>
</header>

<main class="min-h-screen">
  <router-outlet></router-outlet>
</main>

<footer class="border-t border-white/5 bg-[#030816] py-12">
  <div class="mx-auto max-w-7xl px-6 text-center">
    <div class="mb-8 flex justify-center gap-6 text-slate-400">
      <a href="#" class="hover:text-white"><i class="pi pi-twitter"></i></a>
      <a href="#" class="hover:text-white"><i class="pi pi-linkedin"></i></a>
      <a href="#" class="hover:text-white"><i class="pi pi-github"></i></a>
    </div>
    <p class="text-sm tracking-wide text-slate-500">
      {{ settings.footerText }}
    </p>
    <div class="mt-4 flex justify-center gap-8 text-xs font-medium uppercase tracking-tighter text-slate-600">
      <a href="#" class="hover:text-slate-400">Privacy Policy</a>
      <a href="#" class="hover:text-slate-400">Terms of Service</a>
      <a href="#" class="hover:text-slate-400">Contact Us</a>
    </div>
  </div>
</footer>
