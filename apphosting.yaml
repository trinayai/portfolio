# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  memoryMiB: 1024

# Build configuration.
# See https://firebase.google.com/docs/app-hosting/configure#install-command
installConfig:
  # Using legacy-peer-deps to avoid conflicts between PrimeNG 17 and other packages
  installCommand: npm install --legacy-peer-deps

